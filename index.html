<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charging Tracker — go-e &times; spot price</title>
<style>
  :root{
    --bg: #0a0e14;
    --bg-panel: #10151d;
    --bg-panel-2: #151b25;
    --line: #232b38;
    --text: #e7ecf3;
    --text-dim: #8b96a8;
    --amber: #ffb020;
    --amber-dim: #7a5a1f;
    --cyan: #4fd1c5;
    --cyan-dim: #1f4a47;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background: var(--bg); color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .grid-overlay{
    position: fixed; inset:0; pointer-events:none; opacity:.35;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at top, black, transparent 70%);
  }
  header{
    padding: 56px 24px 32px; max-width: 1080px; margin: 0 auto;
    position: relative;
  }
  .lang-switch{
    position: absolute; top: 24px; right: 24px; display:flex; gap:4px;
  }
  .lang-btn{
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    background: var(--bg-panel); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; cursor: pointer; transition: .15s;
    letter-spacing: .05em;
  }
  .lang-btn:hover{ color: var(--text); border-color: var(--cyan-dim); }
  .lang-btn.active{ color: var(--bg); background: var(--cyan); border-color: var(--cyan); font-weight: 600; }
  .eyebrow{
    font-family: var(--mono); font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 14px;
    display:flex; align-items:center; gap:8px;
  }
  .pulse{ width:7px; height:7px; border-radius:50%; background: var(--amber);
    box-shadow: 0 0 0 0 rgba(255,176,32,.6); animation: pulse 2s infinite; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,176,32,.5); }
    70%{ box-shadow: 0 0 0 8px rgba(255,176,32,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,176,32,0); }
  }
  h1{
    font-family: var(--mono); font-weight: 700; font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 8px; letter-spacing: -0.01em; line-height: 1.1;
  }
  h1 span{ color: var(--text-dim); font-weight: 400; }
  .sub{ color: var(--text-dim); font-size: 15px; max-width: 62ch; line-height:1.5;}

  main{ max-width: 1080px; margin: 0 auto; padding: 0 24px 80px; position:relative; }

  .top-grid{
    display: grid; grid-template-columns: 1fr 340px; gap: 24px;
    align-items: start; margin-bottom: 0;
  }
  .col-left .panel:last-child{ margin-bottom: 0; }
  .col-right{ position: sticky; top: 24px; }
  @media (max-width: 820px){
    .top-grid{ grid-template-columns: 1fr; }
    .col-right{ position: static; }
  }

  .stat-row{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap:1px; background: var(--line); border:1px solid var(--line);
    border-radius:10px; overflow:hidden; margin: 32px 0;
  }
  .stat{
    background: var(--bg-panel); padding: 22px 20px;
  }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:.1em;
    color: var(--text-dim); margin-bottom:10px; font-family: var(--mono);}
  .stat .value{ font-family: var(--mono); font-size: 30px; font-weight:700; }
  .stat.amber .value{ color: var(--amber); }
  .stat.cyan .value{ color: var(--cyan); }

  .panel{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding: 24px; margin-bottom: 24px;
  }
  .panel h2, .panel summary{
    font-family: var(--mono); font-size: 13px; text-transform:uppercase;
    letter-spacing:.1em; color: var(--text-dim); margin: 0 0 18px;
    display:flex; align-items:center; gap:8px;
  }
  details.panel summary{
    cursor: pointer; list-style: none; user-select: none;
  }
  details.panel summary::-webkit-details-marker{ display:none; }
  details.panel summary::before{
    content: '▸'; display:inline-block; color: var(--cyan);
    transition: transform .15s; font-size: 11px; flex-shrink:0;
  }
  details.panel[open] summary::before{ transform: rotate(90deg); }
  details.panel[open] summary{ margin-bottom: 18px; }
  details.panel:not([open]) summary{ margin-bottom: 0; }

  .controls{ display:flex; flex-wrap:wrap; gap: 28px; align-items:center; }
  .toggle{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    font-family: var(--mono); font-size: 13px; color: var(--text);
    user-select:none;
  }
  .switch{
    width: 38px; height: 22px; border-radius: 11px; background: var(--bg-panel-2);
    border:1px solid var(--line); position:relative; transition: .15s;
    flex-shrink:0;
  }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:16px; height:16px;
    border-radius:50%; background: var(--text-dim); transition: .15s;
  }
  input[type=checkbox]{ display:none; }
  input[type=checkbox]:checked + .switch{ background: var(--cyan-dim); border-color: var(--cyan); }
  input[type=checkbox]:checked + .switch::after{ background: var(--cyan); transform: translateX(16px); }

  .margin-input{
    display:flex; align-items:center; gap:8px; font-family: var(--mono); font-size:13px;
    opacity:1; transition:.15s;
  }
  .margin-input.disabled{ opacity:.35; pointer-events:none; }
  .margin-input input[type=number], .margin-input input[type=date]{
    background: var(--bg); border:1px solid var(--line); color: var(--amber);
    font-family: var(--mono); font-size:13px; padding: 6px 8px; border-radius:5px;
    color-scheme: dark;
  }
  .margin-input input[type=number]{ width: 70px; }
  .margin-input input[type=date]{ width: 145px; }
  .margin-input input:focus{ outline: 1px solid var(--amber); }

  .field-note{ color: var(--text-dim); font-size:12px; margin: 14px 0 0; line-height:1.5; }

  .period-btn{
    font-family: var(--mono); font-size: 12.5px; color: var(--text-dim);
    background: var(--bg-panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; transition: .15s;
  }
  .period-btn:hover{ color: var(--text); border-color: var(--cyan-dim); }
  .period-btn.active{ color: var(--bg); background: var(--cyan); border-color: var(--cyan); font-weight: 600; }

  canvas{ width: 100%; height: 220px; display:block; }

  table{ width:100%; border-collapse: collapse; font-family: var(--mono); font-size:12.5px; }
  th, td{ text-align:right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child{ text-align:left; color: var(--text-dim); }
  th{ text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; color: var(--text-dim); font-weight:600;}
  tbody tr:hover{ background: var(--bg-panel-2); }

  footer{
    max-width:1080px; margin: 0 auto; padding: 0 24px 60px;
    color: var(--text-dim); font-size: 12.5px; font-family: var(--mono);
    display:flex; justify-content:flex-end; flex-wrap:wrap; gap:8px;
  }

  .empty{ color: var(--text-dim); font-family: var(--mono); font-size:13px; padding: 30px 0; text-align:center;}
  .skeleton{ color: var(--text-dim); }

  @media (prefers-reduced-motion: reduce){ .pulse{ animation: none; } }
</style>
</head>
<body>
<div class="grid-overlay"></div>

<header>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="fi">FI</button>
  </div>
  <div class="eyebrow"><span class="pulse"></span> <span data-i18n="eyebrow"></span></div>
  <h1><span data-i18n="title"></span> <span data-i18n="titleSub"></span></h1>
  <p class="sub" data-i18n="subtitle"></p>
</header>

<main>

  <div class="top-grid">
    <div class="col-left">
      <details class="panel" open>
        <summary data-i18n="pricingHeading"></summary>
        <div class="controls">
          <label class="toggle">
            <input type="checkbox" id="vatToggle" checked>
            <span class="switch"></span>
            <span data-i18n="vatLabel"></span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="marginToggle" checked>
            <span class="switch"></span>
            <span data-i18n="marginLabel"></span>
          </label>
          <div class="margin-input" id="marginInputWrap">
            <span style="color:var(--text-dim)" data-i18n="cKwh"></span>
            <input type="number" id="marginValue" value="0.39" step="0.01" min="0">
          </div>
        </div>
        <p class="field-note" data-i18n="marginNote"></p>
      </details>

      <details class="panel" open>
        <summary><span data-i18n="transferHeading"></span> <span style="font-weight:400; text-transform:none; letter-spacing:0; font-size:11px;" data-i18n="transferHeadingSub"></span></summary>
        <div class="controls">
          <label class="toggle">
            <input type="checkbox" id="transferToggle" checked>
            <span class="switch"></span>
            <span data-i18n="includeTransfer"></span>
          </label>
        </div>
        <div class="controls" id="transferInputWrap" style="margin-top:16px;">
          <div class="margin-input">
            <span style="color:var(--text-dim)" data-i18n="winterRateLabel"></span>
            <input type="number" id="winterRateValue" value="5.67" step="0.01" min="0">
          </div>
          <div class="margin-input">
            <span style="color:var(--text-dim)" data-i18n="offPeakLabel"></span>
            <input type="number" id="otherRateValue" value="3.24" step="0.01" min="0">
          </div>
          <div class="margin-input">
            <span style="color:var(--text-dim)" data-i18n="taxLabel"></span>
            <input type="number" id="taxRateValue" value="2.92" step="0.01" min="0">
          </div>
        </div>
        <p class="field-note" data-i18n="transferNote"></p>
      </details>
    </div>

    <div class="col-right">
      <details class="panel" open>
        <summary data-i18n="periodHeading"></summary>
        <div class="controls" id="periodFilter">
          <button class="period-btn active" data-period="all" data-i18n="periodAll"></button>
          <button class="period-btn" data-period="week" data-i18n="periodWeek"></button>
          <button class="period-btn" data-period="month" data-i18n="periodMonth"></button>
          <button class="period-btn" data-period="quarter" data-i18n="periodQuarter"></button>
          <button class="period-btn" data-period="ytd" data-i18n="periodYtd"></button>
        </div>
        <div class="controls" style="margin-top:16px;">
          <div class="margin-input">
            <span style="color:var(--text-dim)" data-i18n="periodFromLabel"></span>
            <input type="date" id="customStartDate">
          </div>
          <div class="margin-input">
            <span style="color:var(--text-dim)" data-i18n="periodToLabel"></span>
            <input type="date" id="customEndDate">
          </div>
        </div>
      </details>
    </div>
  </div>

  <div class="stat-row" id="statRow">
    <div class="stat"><div class="label" data-i18n="statTotalCharged"></div><div class="value skeleton">–</div></div>
    <div class="stat amber"><div class="label" data-i18n="statEnergyCost"></div><div class="value skeleton">–</div></div>
    <div class="stat" style="color:var(--text)"><div class="label" data-i18n="statTransferTax"></div><div class="value skeleton">–</div></div>
    <div class="stat cyan"><div class="label" data-i18n="statTotal"></div><div class="value skeleton">–</div></div>
    <div class="stat amber"><div class="label" data-i18n="statAvgEnergyPrice"></div><div class="value skeleton">–</div></div>
    <div class="stat"><div class="label" data-i18n="statAvgTotalPrice"></div><div class="value skeleton">–</div></div>
    <div class="stat"><div class="label" data-i18n="statPeriod"></div><div class="value skeleton" style="font-size:16px">–</div></div>
  </div>

  <details class="panel" id="kwhChartPanel">
    <summary data-i18n="kwhChartHeading"></summary>
    <canvas id="kwhChart"></canvas>
  </details>

  <details class="panel" id="costChartPanel">
    <summary data-i18n="costChartHeading"></summary>
    <canvas id="costChart"></canvas>
  </details>

  <details class="panel" open>
    <summary><span data-i18n="drivingHeading"></span> <span style="font-weight:400; text-transform:none; letter-spacing:0; font-size:11px;" data-i18n="drivingHeadingSub"></span></summary>
    <p class="field-note" style="margin:0 0 16px;" data-i18n="drivingNote"></p>
    <div class="controls">
      <div class="margin-input">
        <span style="color:var(--text-dim)" data-i18n="effSummerLabel"></span>
        <input type="number" id="effSummerValue" value="160" step="1" min="1">
      </div>
      <div class="margin-input">
        <span style="color:var(--text-dim)" data-i18n="effWinterLabel"></span>
        <input type="number" id="effWinterValue" value="220" step="1" min="1">
      </div>
    </div>
    <div class="stat-row" style="margin-top:16px;">
      <div class="stat amber"><div class="label" data-i18n="summerStatLabel"></div><div class="value" id="costPer100Summer">–</div></div>
      <div class="stat cyan"><div class="label" data-i18n="winterStatLabel"></div><div class="value" id="costPer100Winter">–</div></div>
      <div class="stat"><div class="label" data-i18n="avgPriceLabel"></div><div class="value" id="avgPriceForEstimate" style="font-size:20px;">–</div></div>
    </div>
  </details>

  <details class="panel" id="tablePanel" style="display:none" open>
    <summary data-i18n="tableHeading"></summary>
    <p class="field-note" style="margin:0 0 14px;" data-i18n="tableNote"></p>
    <div style="max-height:320px; overflow:auto;">
      <table>
        <thead>
          <tr>
            <th data-i18n="thHour"></th><th>kWh</th><th data-i18n="thSpot"></th>
            <th data-i18n="thEnergy"></th><th data-i18n="thTransfer"></th><th data-i18n="thCost"></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </details>

</main>

<footer>
  <span id="lastUpdated">–</span>
</footer>

<script>
// ---- Käännökset ----
const TRANSLATIONS = {
  en: {
    eyebrow: 'LIVE',
    title: 'Charging Tracker', titleSub: 'go-e × spot price',
    subtitle: 'Data is collected automatically via GitHub Actions, which connects to the go-e Cloud API to retrieve charging data and fetches Finnish electricity spot prices for the corresponding charging period.',
    periodHeading: 'Time period', periodAll: 'All', periodWeek: 'This week',
    periodMonth: 'This month', periodQuarter: 'This quarter', periodYtd: 'Year to date',
    periodFromLabel: 'From:', periodToLabel: 'To:',
    pricingHeading: 'Pricing settings', vatLabel: 'VAT (25.5\u00a0%)', marginLabel: 'Margin', cKwh: 'c/kWh:',
    marginNote: 'The margin is the fee your electricity retailer adds on top of the spot price, as defined in your electricity contract.',
    transferHeading: 'Grid transfer', transferHeadingSub: '(your utility contract)',
    includeTransfer: 'Include transfer + tax',
    winterRateLabel: 'Winter weekday (Nov-Mar, Mon-Fri, 07-22) c/kWh:',
    offPeakLabel: 'Other times c/kWh:', taxLabel: 'Electricity tax (Class I) c/kWh:',
    transferNote: 'Grid transfer and electricity tax are a separate cost from energy - the margin does not apply to them. VAT is calculated on the full total (energy + transfer + tax) together, the same way it appears on your electricity bill.',
    statTotalCharged: 'Total charged', statEnergyCost: 'Energy cost', statTransferTax: 'Transfer + tax',
    statTotal: 'Total', statAvgEnergyPrice: 'Avg. energy price', statAvgTotalPrice: 'Avg. total price (incl. transfer)', statPeriod: 'Period',
    kwhChartHeading: 'Energy charged / day', costChartHeading: 'Cost / day',
    drivingHeading: 'Driving cost estimate', drivingHeadingSub: '(rough estimate - actual conditions vary)',
    drivingNote: 'Based on the total electricity price calculated above (energy + transfer, with your chosen VAT/margin settings) multiplied by an estimated consumption. Accurate per-trip data (Tesla integration) will complement this later, once the connection is working.',
    effSummerLabel: 'Summer consumption, Wh/km:', effWinterLabel: 'Winter consumption, Wh/km:',
    summerStatLabel: '\u2600\ufe0f Summer, \u20ac/100km', winterStatLabel: '\u2744\ufe0f Winter, \u20ac/100km',
    avgPriceLabel: 'Average price used',
    tableHeading: 'Recent hours', tableNote: 'Spot = raw market price (no margin, no VAT). Energy price and Transfer price are the rates actually charged per kWh (margin/transfer+tax included, VAT included when enabled) - kWh × rate = the corresponding part of Total cost.',
    thHour: 'Hour', thSpot: 'Spot (raw) c/kWh', thEnergy: 'Energy price c/kWh',
    thTransfer: 'Transfer price c/kWh', thCost: 'Total cost \u20ac',
    latestReading: 'Latest reading:',
    noDataYet: 'No data yet. The summary will appear here after the first successful run.',
    loadFailed: msg => `Failed to load data (${msg}). Check that the repo is public and kustannukset.csv exists.`,
    locale: 'en-GB', unitSnt: 'c/kWh',
  },
  fi: {
    eyebrow: 'LIVE',
    title: 'Latausseuranta', titleSub: 'go-e × pörssisähkö',
    subtitle: 'Data kerätään automaattisesti GitHub Actionsilla, joka hakee lataustiedot go-e Cloud -rajapinnasta ja noutaa Suomen pörssisähkön tuntihinnat kyseiselle latausjaksolle.',
    periodHeading: 'Ajanjakso', periodAll: 'Kaikki', periodWeek: 'Tämä viikko',
    periodMonth: 'Tämä kuukausi', periodQuarter: 'Tämä kvartaali', periodYtd: 'Vuoden alusta',
    periodFromLabel: 'Alkaen:', periodToLabel: 'Asti:',
    pricingHeading: 'Hinnoitteluasetukset', vatLabel: 'ALV (25,5\u00a0%)', marginLabel: 'Marginaali', cKwh: 'snt/kWh:',
    marginNote: 'Marginaali on sähkösopimuksesi mukainen lisä, jonka sähkönmyyjäsi lisää pörssihinnan päälle.',
    transferHeading: 'Sähkönsiirto', transferHeadingSub: '(oma verkkoyhtiön sopimus)',
    includeTransfer: 'Sisällytä siirto + vero',
    winterRateLabel: 'Talviarkipäivä (11-3, ma-pe, 07-22) snt/kWh:',
    offPeakLabel: 'Muu aika snt/kWh:', taxLabel: 'Sähkövero (luokka I) snt/kWh:',
    transferNote: 'Siirto ja sähkövero ovat oma, energiahinnasta erillinen kustannus - marginaali ei vaikuta niihin. ALV lasketaan koko summalle (energia + siirto + vero) yhdessä, samaan tapaan kuin sähkölaskulla.',
    statTotalCharged: 'Ladattu yhteensä', statEnergyCost: 'Energiakustannus', statTransferTax: 'Siirto + vero',
    statTotal: 'Yhteensä', statAvgEnergyPrice: 'Keskihinta (energia)', statAvgTotalPrice: 'Keskihinta (energia+siirto)', statPeriod: 'Ajanjakso',
    kwhChartHeading: 'Ladattu energia / vrk', costChartHeading: 'Kustannus / vrk',
    drivingHeading: 'Ajokustannusarvio', drivingHeadingSub: '(karkea arvio - todelliset olosuhteet vaihtelevat)',
    drivingNote: 'Perustuu ylläpuolella lasketun sähkön kokonaishintaan (energia + siirto, valitsemillasi ALV/marginaali-asetuksilla) kerrottuna arvioidulla kulutuksella. Tarkka ajokohtainen data (Tesla-integraatio) täydentää tätä myöhemmin, kunhan yhteys saadaan auki.',
    effSummerLabel: 'Kulutus kesällä, Wh/km:', effWinterLabel: 'Kulutus talvella, Wh/km:',
    summerStatLabel: '\u2600\ufe0f Kesä, \u20ac/100km', winterStatLabel: '\u2744\ufe0f Talvi, \u20ac/100km',
    avgPriceLabel: 'Käytetty keskihinta',
    tableHeading: 'Viimeisimmät tunnit', tableNote: 'Spot = raakamarkkinahinta (ei marginaalia, ei ALV:tä). Energiahinta ja Siirtohinta ovat todelliset veloitettavat snt/kWh-hinnat (marginaali/siirto+vero mukana, ALV mukana jos päällä) - kWh × hinta = vastaava osuus Kokonaishinnasta.',
    thHour: 'Tunti', thSpot: 'Spot (raaka) snt/kWh', thEnergy: 'Energiahinta snt/kWh',
    thTransfer: 'Siirtohinta snt/kWh', thCost: 'Kokonaishinta \u20ac',
    latestReading: 'Uusin mittaus:',
    noDataYet: 'Ei vielä dataa. Yhteenveto ilmestyy ensimmäisen onnistuneen ajon jälkeen.',
    loadFailed: msg => `Datan lataus epäonnistui (${msg}). Tarkista että repo on julkinen ja kustannukset.csv on olemassa.`,
    locale: 'fi-FI', unitSnt: 'snt/kWh',
  },
};

let currentLang = 'en';

function t(key) { return TRANSLATIONS[currentLang][key]; }

function applyStaticTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = TRANSLATIONS[currentLang][key];
    if (typeof val === 'string') el.textContent = val;
  });
  document.documentElement.lang = currentLang;
}

// ---- Konfiguraatio ----
// Haetaan CSV suoraan samasta origin:ista (GitHub Pages) jsDelivr:n sijaan,
// koska jsDelivr pitää tiedostoja välimuistissa tuntikausia - sopimaton
// 15 min välein päivittyvälle datalle. Sama origin myös välttää CORS-
// ongelman ilman ulkopuolista CDN:ää. Cache-bust-parametri (?t=...)
// pakottaa selaimen hakemaan aina tuoreimman version omasta
// välimuististaankin.
const CSV_URL = `./kustannukset.csv?t=${Date.now()}`;

const VAT_RATE = 0.255;

// Poimii kellonaikakomponentit AINA Suomen paikallisajassa riippumatta
// katsojan omasta selaimen aikavyöhykkeestä - kriittistä oikealle
// talviarkipäivä/muu aika -luokittelulle.
const HELSINKI_FMT = new Intl.DateTimeFormat('en-GB', {
  timeZone: 'Europe/Helsinki',
  month: 'numeric',
  weekday: 'short',
  hour: 'numeric',
  hourCycle: 'h23',
});
function helsinkiParts(date) {
  const parts = HELSINKI_FMT.formatToParts(date);
  const map = {};
  parts.forEach(p => { map[p.type] = p.value; });
  return { month: parseInt(map.month, 10), weekday: map.weekday, hour: parseInt(map.hour, 10) };
}

// Suomen paikallisajan PÄIVÄMÄÄRÄ (ei kellonaika) - kriittinen päivittäiselle
// ryhmittelylle. en-CA-locale antaa suoraan YYYY-MM-DD-muodon. toISOString()
// EI kelpaa tähän, koska se antaa UTC-kalenteripäivän - esim. klo 00-03
// Suomen aikaa on UTC:ssa vielä edellistä päivää kesäaikana, jolloin
// yölataukset putoaisivat väärän päivän kohdalle kaaviossa.
const HELSINKI_DATE_FMT = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Europe/Helsinki', year: 'numeric', month: '2-digit', day: '2-digit',
});
function helsinkiDateKey(date) {
  return HELSINKI_DATE_FMT.format(date); // "2026-08-29"
}

// Talviarkipäivä: marras-maaliskuu (11,12,1,2,3), ma-pe, klo 07-22.
// Kaikki muu (talven yöt/viikonloput, koko kesä 24h) = "muu aika".
function isWinterWeekday(date) {
  const { month, weekday, hour } = helsinkiParts(date);
  const isWinterMonth = month === 11 || month === 12 || month <= 3;
  const isWeekday = weekday !== 'Sat' && weekday !== 'Sun';
  const isDayHour = hour >= 7 && hour < 22;
  return isWinterMonth && isWeekday && isDayHour;
}

function transferRate(date) {
  const winterRate = parseFloat(document.getElementById('winterRateValue').value) || 0;
  const otherRate = parseFloat(document.getElementById('otherRateValue').value) || 0;
  const taxRate = parseFloat(document.getElementById('taxRateValue').value) || 0;
  const base = isWinterWeekday(date) ? winterRate : otherRate;
  return base + taxRate;
}

let rows = []; // {hour: Date, kwh, spot} - spot ilman ALV/marginaalia

function parseCSV(text){
  const lines = text.trim().split("\n");
  const header = lines[0].split(",");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    const obj = {};
    header.forEach((h,i) => obj[h.trim()] = cols[i]);
    return {
      hour: new Date(obj.tunti),
      kwh: parseFloat(obj.kwh),
      spot: obj.spot_snt_kwh === "" ? null : parseFloat(obj.spot_snt_kwh),
    };
  }).filter(r => !isNaN(r.kwh));
}

function currentPrice(spot){
  if (spot === null) return null;
  const marginOn = document.getElementById('marginToggle').checked;
  const marginVal = parseFloat(document.getElementById('marginValue').value) || 0;
  let price = spot;
  if (marginOn) price += marginVal;
  return price; // ALV lisätään myöhemmin koko summalle (energia+siirto)
}

function fmtEur(n){ return n.toLocaleString(t('locale'), {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
function fmtSnt(n){ return n.toLocaleString(t('locale'), {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + t('unitSnt'); }
function fmtKwh(n){ return n.toLocaleString(t('locale'), {minimumFractionDigits:1, maximumFractionDigits:1}) + ' kWh'; }

let currentPeriod = 'all';

function todayHelsinkiParts() {
  const [y, m, d] = helsinkiDateKey(new Date()).split('-').map(Number);
  return { y, m, d };
}

// Palauttaa {start, end} "YYYY-MM-DD" jaksorajat (molemmat mukaan lukien),
// null = ei rajaa siihen suuntaan.
function getPeriodRange(period) {
  const { y, m, d } = todayHelsinkiParts();
  const pad = n => String(n).padStart(2, '0');

  if (period === 'custom') {
    const startVal = document.getElementById('customStartDate').value || null;
    const endVal = document.getElementById('customEndDate').value || null;
    return { start: startVal, end: endVal };
  }
  if (period === 'week') {
    const dateObj = new Date(Date.UTC(y, m - 1, d));
    const dow = dateObj.getUTCDay(); // 0=su,1=ma,...
    const diffToMonday = (dow === 0) ? 6 : dow - 1;
    dateObj.setUTCDate(dateObj.getUTCDate() - diffToMonday);
    return { start: dateObj.toISOString().slice(0, 10), end: null };
  }
  if (period === 'month') return { start: `${y}-${pad(m)}-01`, end: null };
  if (period === 'quarter') {
    const qStartMonth = Math.floor((m - 1) / 3) * 3 + 1;
    return { start: `${y}-${pad(qStartMonth)}-01`, end: null };
  }
  if (period === 'ytd') return { start: `${y}-01-01`, end: null };
  return { start: null, end: null }; // 'all'
}

function render(){
  const vatOn = document.getElementById('vatToggle').checked;
  const transferOn = document.getElementById('transferToggle').checked;

  const { start: startKey, end: endKey } = getPeriodRange(currentPeriod);
  const activeRows = rows.filter(r => {
    const day = helsinkiDateKey(r.hour);
    if (startKey && day < startKey) return false;
    if (endKey && day > endKey) return false;
    return true;
  });

  const statRow = document.getElementById('statRow');
  const stats = statRow.querySelectorAll('.value');

  if (!activeRows.length) {
    stats.forEach(s => { s.textContent = '–'; });
    document.getElementById('kwhChart').getContext('2d').clearRect(0,0,9999,9999);
    document.getElementById('costChart').getContext('2d').clearRect(0,0,9999,9999);
    document.getElementById('tablePanel').style.display = 'none';
    document.getElementById('costPer100Summer').textContent = '–';
    document.getElementById('costPer100Winter').textContent = '–';
    document.getElementById('avgPriceForEstimate').textContent = '–';
    return;
  }

  const withPrice = activeRows.map(r => {
    const energyPrice = currentPrice(r.spot); // spot (+marginaali), ei ALV:tä viel
    const transferPrice = transferOn ? transferRate(r.hour) : 0; // siirto+vero, ei ALV:tä viel
    let energyCost = null, transferCost = null, totalCost = null;
    let energyPriceDisplay = null, transferPriceDisplay = null;
    if (energyPrice !== null) {
      const vatMult = vatOn ? (1 + VAT_RATE) : 1;
      energyCost = r.kwh * energyPrice * vatMult / 100;
      transferCost = r.kwh * transferPrice * vatMult / 100;
      totalCost = energyCost + transferCost;
      // Näytettävät snt/kWh-hinnat SISÄLTÄVÄT ALV:n (kun päällä), jotta ne
      // täsmäävät Total cost -sarakkeeseen: kWh × hinta = kyseinen kustannusosuus.
      energyPriceDisplay = energyPrice * vatMult;
      transferPriceDisplay = transferPrice * vatMult;
    }
    return { ...r, energyPrice, transferPrice, energyCost, transferCost, totalCost, energyPriceDisplay, transferPriceDisplay };
  });
  const matched = withPrice.filter(r => r.totalCost !== null);

  const totalKwh = activeRows.reduce((a,r)=>a+r.kwh, 0);
  const totalEnergyCost = matched.reduce((a,r)=>a + r.energyCost, 0);
  const totalTransferCost = matched.reduce((a,r)=>a + r.transferCost, 0);
  const totalCost = totalEnergyCost + totalTransferCost;

  stats[0].textContent = fmtKwh(totalKwh);
  stats[0].classList.remove('skeleton');
  stats[1].textContent = fmtEur(totalEnergyCost);
  stats[1].classList.remove('skeleton');
  stats[2].textContent = fmtEur(totalTransferCost);
  stats[2].classList.remove('skeleton');
  stats[3].textContent = fmtEur(totalCost);
  stats[3].classList.remove('skeleton');
  const avgEnergyPricePerKwh = totalKwh > 0 ? (totalEnergyCost / totalKwh) * 100 : 0;
  const avgTotalPricePerKwh = totalKwh > 0 ? (totalCost / totalKwh) * 100 : 0;
  stats[4].textContent = fmtSnt(avgEnergyPricePerKwh);
  stats[4].classList.remove('skeleton');
  stats[5].textContent = fmtSnt(avgTotalPricePerKwh);
  stats[5].classList.remove('skeleton');
  if (activeRows.length){
    const first = activeRows[0].hour, last = activeRows[activeRows.length-1].hour;
    const fmt = d => d.toLocaleDateString(t('locale'), {day:'2-digit', month:'2-digit', year:'2-digit'});
    stats[6].textContent = `${fmt(first)} – ${fmt(last)}`;
    stats[6].classList.remove('skeleton');
    document.getElementById('lastUpdated').textContent =
      `${t('latestReading')} ${rows[rows.length-1].hour.toLocaleString(t('locale'))}`;
  }

  // Päivittäiset summat kaavioihin
  const dailyKwh = {}, dailyCost = {};
  withPrice.forEach(r => {
    const day = helsinkiDateKey(r.hour);
    dailyKwh[day] = (dailyKwh[day]||0) + r.kwh;
    if (r.totalCost !== null) dailyCost[day] = (dailyCost[day]||0) + r.totalCost;
  });
  // Kaaviot piirretään vain jos paneeli on auki - collapsed <details> antaa
  // leveydeksi 0, jolloin Canvas piirtyisi virheellisesti.
  if (document.getElementById('kwhChartPanel').open) {
    drawBarChart('kwhChart', dailyKwh, getComputedStyle(document.documentElement).getPropertyValue('--amber'));
  }
  if (document.getElementById('costChartPanel').open) {
    drawBarChart('costChart', dailyCost, getComputedStyle(document.documentElement).getPropertyValue('--cyan'));
  }

  // Taulukko: viimeiset 40 tuntia (suodatetusta jaksosta)
  const last40 = withPrice.slice(-40).reverse();
  if (last40.length){
    document.getElementById('tablePanel').style.display = '';
    document.getElementById('tableBody').innerHTML = last40.map(r => `
      <tr>
        <td>${r.hour.toLocaleString(t('locale'), {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</td>
        <td>${r.kwh.toFixed(2)}</td>
        <td>${r.spot !== null ? r.spot.toFixed(2) : '–'}</td>
        <td>${r.energyPriceDisplay !== null ? r.energyPriceDisplay.toFixed(2) : '–'}</td>
        <td>${transferOn ? r.transferPriceDisplay.toFixed(2) : '–'}</td>
        <td>${r.totalCost !== null ? r.totalCost.toFixed(3) : '–'}</td>
      </tr>`).join('');
  } else {
    document.getElementById('tablePanel').style.display = 'none';
  }

  // Ajokustannusarvio: käytetään koko ajanjakson kulutuspainotettua
  // keskihintaa (€/kWh) kerrottuna arvioidulla Wh/km-kulutuksella.
  if (matched.length) {
    const avgPricePerKwhEur = totalCost / totalKwh; // € per kWh (kulutuspainotettu koko datalla)
    const effSummer = parseFloat(document.getElementById('effSummerValue').value) || 0;
    const effWinter = parseFloat(document.getElementById('effWinterValue').value) || 0;

    const costPer100Summer = avgPricePerKwhEur * (effSummer / 1000) * 100;
    const costPer100Winter = avgPricePerKwhEur * (effWinter / 1000) * 100;

    document.getElementById('costPer100Summer').textContent = fmtEur(costPer100Summer);
    document.getElementById('costPer100Winter').textContent = fmtEur(costPer100Winter);
    document.getElementById('avgPriceForEstimate').textContent =
      (avgPricePerKwhEur * 100).toLocaleString(t('locale'), {minimumFractionDigits:2, maximumFractionDigits:2}) + ' ' + t('unitSnt');
  }
}

function drawBarChart(canvasId, dataObj, color){
  const canvas = document.getElementById(canvasId);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 220 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,rect.width,220);

  const days = Object.keys(dataObj).sort().slice(-21);
  const values = days.map(d => dataObj[d]);
  if (!values.length) return;
  const max = Math.max(...values, 0.001);

  const padL = 46, padB = 28, padT = 10;
  const w = rect.width - padL - 10;
  const h = 220 - padB - padT;
  const barW = w / days.length * 0.65;
  const gap = w / days.length;

  ctx.strokeStyle = '#232b38';
  ctx.lineWidth = 1;
  for (let i=0;i<=3;i++){
    const y = padT + h - (h*i/3);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+w, y); ctx.stroke();
    ctx.fillStyle = '#8b96a8'; ctx.font = '10px monospace'; ctx.textAlign='right';
    ctx.fillText((max*i/3).toFixed(1), padL-8, y+3);
  }

  days.forEach((d,i) => {
    const val = dataObj[d];
    const barH = (val/max) * h;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + h - barH;
    ctx.fillStyle = color.trim();
    ctx.fillRect(x, y, barW, barH);
    ctx.fillStyle = '#8b96a8'; ctx.font = '9px monospace'; ctx.textAlign='center';
    const label = new Date(d).toLocaleDateString(t('locale'), {day:'2-digit', month:'2-digit', timeZone:'UTC'});
    ctx.fillText(label, x+barW/2, 220-10);
  });
}

async function load(){
  try{
    const resp = await fetch(CSV_URL, {cache: 'no-store'});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    rows = parseCSV(text).sort((a,b) => a.hour - b.hour);
    if (!rows.length){
      document.querySelector('main').insertAdjacentHTML('afterbegin',
        `<div class="empty" id="emptyMsg">${t('noDataYet')}</div>`);
      return;
    }
    render();
  } catch(e){
    document.querySelector('main').insertAdjacentHTML('afterbegin',
      `<div class="empty" id="emptyMsg">${t('loadFailed')(e.message)}</div>`);
  }
}

[
  'vatToggle','marginToggle','marginValue',
  'transferToggle','winterRateValue','otherRateValue','taxRateValue',
  'effSummerValue','effWinterValue',
].forEach(id => {
  document.getElementById(id).addEventListener('input', () => { if(rows.length) render(); });
});
document.getElementById('marginToggle').addEventListener('change', function(){
  document.getElementById('marginInputWrap').classList.toggle('disabled', !this.checked);
});
document.getElementById('transferToggle').addEventListener('change', function(){
  document.getElementById('transferInputWrap').classList.toggle('disabled', !this.checked);
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    document.getElementById('customStartDate').value = '';
    document.getElementById('customEndDate').value = '';
    if (rows.length) render();
  });
});

['customStartDate','customEndDate'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    currentPeriod = 'custom';
    if (rows.length) render();
  });
});

// Kaavioiden Canvas-leveys on 0 kun <details> on kiinni (collapsed), joten
// piirretään ne uudestaan aina kun paneeli avataan.
['kwhChartPanel','costChartPanel'].forEach(id => {
  document.getElementById(id).addEventListener('toggle', function(){
    if (this.open && rows.length) render();
  });
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    applyStaticTranslations();
    const emptyMsg = document.getElementById('emptyMsg');
    if (emptyMsg) emptyMsg.textContent = rows.length ? '' : t('noDataYet');
    if (rows.length) render();
  });
});

window.addEventListener('resize', () => { if(rows.length) render(); });

applyStaticTranslations();
load();
</script>
