name: go-e charger logger

on:
  schedule:
    # Ajetaan 15 minuutin välein, mutta 7 min yli tasavarttien - GitHubin
    # oma ruuhka on pahin juuri tasatunneilla/-varteilla (:00, :15, :30, :45),
    # koska valtaosa maailman ajastetuista workflowista yrittää käynnistyä
    # silloin. Offset pienentää todennäköisyyttä pitkälle viiveelle.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # mahdollistaa myös manuaalisen ajon "Run workflow" -napista

permissions:
  contents: write   # workflow tarvitsee kirjoitusoikeuden committaakseen datan takaisin repoon

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna riippuvuudet (yhteenvetokaaviota ja aikavyöhykettä varten)
        run: pip install matplotlib tzdata

      - name: Kysy go-e:n tila ja lisää lokiin
        env:
          GOE_SERIAL: ${{ secrets.GOE_SERIAL }}
          GOE_TOKEN: ${{ secrets.GOE_TOKEN }}
        run: python3 goe_logger.py --once

      - name: Päivitä tuntikohtainen data ja yhteenveto
        run: python3 update_summary.py

      - name: Committaa päivittynyt loki ja yhteenveto
        run: |
          git config user.name "goe-logger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add goe_log.csv tuntikohtainen.csv kustannukset.csv summary_chart.png README.md
          git diff --staged --quiet || git commit -m "Päivitetty lataustilan mittaus ja yhteenveto $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
